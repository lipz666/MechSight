<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>隐藏中间体核验</title>
<style>
:root{
  --ground:#F4F6F3; --surface:#FFFFFF; --surface2:#EEF2EF; --ink:#121A18; --ink2:#4C5956; --ink3:#7B8884;
  --rule:#D2D9D4; --accent:#2F45B5; --accent-soft:#DDE1F5; --break:#B3402F; --break-soft:#F4D8D4; --form:#1F7A52;
  --ok:#1F7A52; --warn:#A36A00; --bad:#B3402F;
  --sans:"Inter","PingFang SC","Helvetica Neue",Arial,sans-serif; --mono:"JetBrains Mono","SF Mono",Menlo,monospace;
  --shadow:0 1px 2px rgba(18,26,24,.06),0 4px 14px rgba(18,26,24,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F1312; --surface:#161C1A; --surface2:#1D2522; --ink:#E7EDE9; --ink2:#A2AFAB; --ink3:#74817D;
  --rule:#28302D; --accent:#8496FF; --accent-soft:#232C4E; --break:#E0786A; --break-soft:#4A2622; --form:#5CC495;
  --ok:#5CC495; --warn:#E0B45C; --bad:#E0786A;
}}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans); font-size:14px}
header{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:10px 20px; border-bottom:1px solid var(--rule); background:var(--surface); position:sticky; top:0; z-index:5}
header h1{font-size:15px; margin:0; font-weight:650; letter-spacing:.01em; white-space:nowrap}
.tabs{display:flex; gap:6px; flex-wrap:wrap}
.tabs button{font:inherit; border:1px solid var(--rule); background:transparent; color:var(--ink2); padding:5px 12px; border-radius:3px; cursor:pointer; white-space:nowrap}
header label, header .btn{white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.spacer{flex:1}
input[type=text],textarea{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--rule); border-radius:3px; padding:5px 8px}
.btn{font:inherit; border:1px solid var(--rule); background:var(--surface); color:var(--ink); padding:5px 12px; border-radius:3px; cursor:pointer}
.btn:hover{border-color:var(--ink3)}
.wrap{display:grid; grid-template-columns:250px 1fr; min-height:calc(100vh - 54px)}
aside{border-right:1px solid var(--rule); overflow:auto; max-height:calc(100vh - 54px); position:sticky; top:54px}
aside .prog{padding:10px 14px; font-family:var(--mono); font-size:11.5px; color:var(--ink3); border-bottom:1px solid var(--rule)}
aside .prog i{display:block; height:4px; background:var(--surface2); margin-top:6px; border-radius:2px; overflow:hidden}
aside .prog i b{display:block; height:100%; background:var(--accent)}
aside button{display:grid; grid-template-columns:14px 1fr; gap:8px; width:100%; text-align:left; font:inherit; background:none; border:0; border-left:3px solid transparent; padding:7px 12px; color:var(--ink2); cursor:pointer}
aside button[aria-current="true"]{border-left-color:var(--accent); background:var(--surface); color:var(--ink)}
aside .dot{width:9px; height:9px; border-radius:50%; margin-top:4px; border:1.5px solid var(--ink3)}
aside .dot.done{background:var(--ok); border-color:var(--ok)}
aside .cid{font-family:var(--mono); font-size:12px}
aside .pair{font-family:var(--mono); font-size:10.5px; color:var(--ink3)}
main{padding:18px 24px 80px; max-width:1500px}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:4px; box-shadow:var(--shadow); padding:14px 16px; margin-bottom:14px}
.card h2{font-size:12px; font-family:var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); margin:0 0 10px; font-weight:600}
.title{display:flex; align-items:baseline; gap:12px; margin-bottom:12px}
.title .cid{font-family:var(--mono); font-size:20px; font-weight:650}
.chip{font-family:var(--mono); font-size:11px; border:1px solid var(--rule); border-radius:10px; padding:2px 8px; color:var(--ink2)}
.scheme{display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--ink)}
.scheme .arrow{font-size:28px; color:var(--ink3)}
.scheme svg{max-width:100%; height:auto}
.smi{font-family:var(--mono); font-size:11px; color:var(--ink3); word-break:break-all; margin-top:4px}
.strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px}
.frame{flex:0 0 auto; border:1px solid var(--rule); border-radius:4px; padding:6px; background:var(--surface); width:400px}
.frame.hidden{border:2px solid var(--form); background:color-mix(in srgb,var(--form) 6%,var(--surface))}
.frame .lab{font-family:var(--mono); font-size:11px; color:var(--ink2); display:flex; justify-content:space-between}
.frame .nx{font-family:var(--mono); font-size:10.5px; color:var(--ink3); min-height:28px; margin-top:4px}
.frame svg{width:100%; height:auto; display:block}
.frame svg .ghost{stroke:var(--form); stroke-width:2; stroke-dasharray:2.5 5; fill:none}
.frame svg .lp{fill:var(--ink)}
.frame svg .charge{font-family:var(--sans); font-size:13px; font-weight:650; fill:var(--ink); text-anchor:middle; dominant-baseline:central}
.frame svg .pgl{display:none}
.legend{display:flex; gap:16px; font-size:12px; color:var(--ink2); margin-top:8px; flex-wrap:wrap}
.legend span::before{content:""; display:inline-block; width:18px; height:0; vertical-align:middle; margin-right:6px}
.legend .lb::before{border-top:6px solid var(--break-soft)} .legend .lf::before{border-top:2px dashed var(--form)} .legend .lh::before{border-top:2px solid var(--form)}
.pairgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.pane{border:1px solid var(--rule); border-radius:4px; padding:10px; color:var(--ink)}
.pane h3{font-size:12.5px; margin:0 0 6px; font-weight:600}
.pane svg{width:100%; height:auto; max-height:320px}
.scheme svg{max-height:230px; width:auto}
.q{display:grid; gap:10px}
.q .opts{display:flex; gap:8px; flex-wrap:wrap}
.q label.opt{border:1px solid var(--rule); border-radius:3px; padding:6px 10px; cursor:pointer; display:flex; gap:6px; align-items:center}
.q label.opt:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
.q textarea{width:100%; min-height:54px}
.q .row{display:flex; gap:10px; align-items:center}
.saved{font-family:var(--mono); font-size:11.5px; color:var(--ok)}
.hint{font-size:12.5px; color:var(--ink2); line-height:1.55}
details.ai{border:1px dashed var(--rule); border-radius:3px; padding:6px 10px; font-size:12.5px; color:var(--ink2)}
.freelist{display:flex; gap:8px; overflow-x:auto}
.freelist .pane{flex:0 0 230px}
kbd{font-family:var(--mono); font-size:11px; border:1px solid var(--rule); border-bottom-width:2px; border-radius:3px; padding:0 4px}
@media (max-width:900px){.wrap{grid-template-columns:1fr} aside{position:static; max-height:240px} .pairgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>隐藏中间体 · 化学家核验</h1>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <label class="hint">核验人 <input type="text" id="reviewer" placeholder="姓名缩写" size="8"></label>
  <button class="btn" id="export">导出 JSON</button>
</header>
<div class="wrap">
  <aside id="list"></aside>
  <main id="main"><p class="hint">载入中…</p></main>
</div>
<script>
const TASKS = {
  match: {name: '匹配核验', help: '模型在自由文本里列出的中间体，被程序判为与参考机理中的隐藏中间体相同。请判断两者是否确实是同一个中间体（允许共振式、电荷标注不同）。'},
  class: {name: '中间体分类', help: '参考机理中这根键先形成后断开，在总反应式里看不见。请判断该隐藏中间体属于哪一类，并评价该步骤化学上是否合理。'},
  analog: {name: '同系物检查', help: '在远离反应中心的碳上加了一个甲基。请判断机理是否保持不变（隐藏中间体与步骤顺序相同）。'},
};
const CLASSES = ['碳正离子 / 1,2-迁移 / 骨架重排','碳负离子 / 烯醇盐 / 有机金属加成物','鎓离子或叶立德（氧鎓、铵、锍、鏻、卤鎓、氮丙啶鎓等）','卡宾 / 类卡宾 / 烯酮 / 氮宾','四面体或加成中间体','邻基参与 / 桥连中间体','环状瞬态加成物（臭氧化物、氧磷杂环丁烷、先环加成再逆反应）','金属结合中间体（氧化加成、插入、金属杂环）','其他'];
const EN = ['carbocation / 1,2-shift / skeletal rearrangement','carbanion / enolate / organometallic adduct','onium ion or ylide (oxonium, ammonium, sulfonium, phosphonium, halonium, aziridinium, episulfonium)','carbene / carbenoid / ketene / nitrene','tetrahedral or addition adduct','neighbouring-group participation / bridged intermediate','cyclic transient adduct (e.g. ozonide, oxaphosphetane, cycloadduct before retro-reaction)','metal-bound intermediate (oxidative addition, insertion, metallacycle)','other'];
let index, task = 'match', pos = 0, answers = {}, cache = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reviewer = () => $('#reviewer').value.trim();
function key(t, id) { return `${reviewer()}|${t}|${id}`; }
function store() { try { localStorage.setItem('ik-answers', JSON.stringify(answers)); } catch (e) {} }

async function init() {
  try { $('#reviewer').value = localStorage.getItem('ik-reviewer') || ''; answers = JSON.parse(localStorage.getItem('ik-answers') || '{}'); } catch (e) {}
  $('#reviewer').addEventListener('change', () => { try { localStorage.setItem('ik-reviewer', reviewer()); } catch (e) {} renderList(); show(); });
  index = await (await fetch('data/index.json')).json();
  try { for (const r of await (await fetch('api/annotations')).json()) answers[`${r.reviewer}|${r.task}|${r.item}`] = r; } catch (e) {}
  $('#tabs').innerHTML = Object.keys(TASKS).map(t => `<button data-t="${t}">${TASKS[t].name} · ${index.tasks[t].length}</button>`).join('');
  $('#tabs').onclick = e => { const t = e.target.dataset.t; if (t) { task = t; pos = 0; renderList(); show(); } };
  $('#export').onclick = () => {
    const blob = new Blob([JSON.stringify(Object.values(answers), null, 1)], {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'annotations.json'; a.click();
  };
  document.addEventListener('keydown', e => {
    if (e.target.matches('input[type=text],textarea')) return;
    if (e.key === 'j') go(pos + 1); else if (e.key === 'k') go(pos - 1);
    else if (/^[1-3]$/.test(e.key)) { const r = document.querySelectorAll('input[name=verdict]')[+e.key - 1]; if (r) { r.checked = true; save(); } }
  });
  renderList(); show();
}

function items() { return index.tasks[task]; }
function go(i) { if (i >= 0 && i < items().length) { pos = i; renderList(); show(); } }

function renderList() {
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === task));
  const its = items(), done = its.filter(it => answers[key(task, it.id)]).length;
  $('#list').innerHTML = `<div class="prog">${done} / ${its.length} 已完成<i><b style="width:${its.length ? 100 * done / its.length : 0}%"></b></i></div>` +
    its.map((it, i) => `<button data-i="${i}" aria-current="${i === pos}"><span class="dot ${answers[key(task, it.id)] ? 'done' : ''}"></span>
      <span><span class="cid">${esc(it.case)}</span><br><span class="pair">${esc(it.pair)}</span></span></button>`).join('');
  $('#list').onclick = e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); };
}

async function loadCase(cid) {
  if (!cache[cid]) cache[cid] = await (await fetch(`data/cases/${cid}.json`)).json();
  return cache[cid];
}

function framesHTML(c, ev) {
  const [w, h] = c.mechanism.canvas;
  return c.mechanism.frames.map((f, k) => {
    const inWin = ev && k >= ev.window[0] && k <= ev.window[1];
    return `<div class="frame ${inWin ? 'hidden' : ''}"><div class="lab"><span>${k === 0 ? '起始' : '第 ' + k + ' 步后'}</span>${inWin ? '<span style="color:var(--form)">隐藏窗口</span>' : ''}</div>
      <svg viewBox="0 0 ${w} ${h}" style="color:var(--ink)">${f.svg}</svg>
      <div class="nx">${f.next_change ? '下一步：' + esc(f.next_change) : '终态'}</div></div>`;
  }).join('');
}

async function show() {
  const it = items()[pos];
  if (!it) { $('#main').innerHTML = '<p class="hint">该任务没有条目。</p>'; return; }
  const c = await loadCase(it.case);
  const ev = c.events.find(e => e.id === it.id);
  const prev = answers[key(task, it.id)];
  let body = `<div class="title"><span class="cid">${esc(c.case)}</span><span class="chip">Set ${esc(c.partition)}</span>
    ${ev ? `<span class="chip">隐藏键 ${esc(ev.pair)}</span>` : ''}<span class="chip">${pos + 1} / ${items().length}</span>
    <span class="spacer"></span><span class="hint"><kbd>j</kbd>/<kbd>k</kbd> 翻页，<kbd>1</kbd>–<kbd>3</kbd> 选择</span></div>
    <div class="card"><h2>任务说明</h2><div class="hint">${TASKS[task].help}</div></div>
    <div class="card"><h2>反应</h2><div class="scheme"><div>${c.reactants_svg}</div><div class="arrow">→</div><div>${c.products_svg}</div></div>
      <div class="smi">条件：${esc(c.conditions)}</div></div>`;
  if (task === 'analog') {
    body += `<div class="card"><h2>原始 vs 同系物（甲基加在 ${esc(c.analog.site)}，距反应中心 ${c.analog.distance} 根键）</h2>
      <div class="pairgrid"><div class="pane"><h3>原始反应物</h3>${c.reactants_svg}<div class="smi">${esc(c.reactants)}</div></div>
      <div class="pane"><h3>同系物反应物</h3>${c.analog.reactants_svg}<div class="smi">${esc(c.analog.reactants)}</div></div></div></div>`;
  }
  body += `<div class="card"><h2>参考机理（GT）</h2><div class="strip">${framesHTML(c, ev)}</div>
    <div class="legend"><span class="lb">下一步断开的键</span><span class="lf">下一步形成的键</span><span class="lh">隐藏窗口（隐藏键存在期间）</span></div></div>`;
  if (ev) {
    body += `<div class="card"><h2>隐藏中间体</h2><div class="pairgrid">
      <div class="pane"><h3>参考机理中的隐藏中间体（隐藏键高亮）</h3>${ev.species_svg}<div class="smi">${esc(ev.species_smiles)}</div></div>`;
    if (task === 'match') {
      const m = ev.matched[0];
      body += `<div class="pane"><h3>模型在自由文本中列出的中间体</h3>${m ? m.svg : '—'}<div class="smi">${m ? esc(m.smiles) : ''}</div></div>`;
    } else body += `<div></div>`;
    body += `</div></div>`;
  }
  body += `<div class="card"><h2>判定</h2><div class="q" id="q">${questionHTML(ev, prev)}</div></div>`;
  $('#main').innerHTML = body;
  $('#q').addEventListener('change', save);
  const t = $('#q textarea'); if (t) t.addEventListener('input', () => { clearTimeout(t._d); t._d = setTimeout(save, 700); });
  window.scrollTo({top: 0});
}

function radios(opts, sel) {
  return `<div class="opts">${opts.map(([v, l], i) => `<label class="opt"><input type="radio" name="verdict" value="${v}" ${sel === v ? 'checked' : ''}> <kbd>${i + 1}</kbd> ${l}</label>`).join('')}</div>`;
}

function questionHTML(ev, prev) {
  const a = prev?.answer || {};
  let h = '';
  if (task === 'match') h += `<div>两者是同一个中间体吗？</div>` + radios([['same', '是同一个'], ['different', '不是'], ['unsure', '不确定']], a.verdict);
  if (task === 'analog') h += `<div>加甲基后机理是否不变？</div>` + radios([['unchanged', '不变'], ['changed', '会改变'], ['unsure', '不确定']], a.verdict);
  if (task === 'class') {
    h += `<div>参考机理中这一隐藏步骤化学上是否合理？</div>` + radios([['sound', '合理'], ['doubtful', '存疑'], ['wrong', '错误']], a.verdict);
    h += `<div>隐藏中间体类别（可多选）</div><div class="opts">${CLASSES.map((c, i) => `<label class="opt"><input type="checkbox" name="cls" value="${i}" ${(a.classes || []).includes(i) ? 'checked' : ''}> ${c}</label>`).join('')}</div>`;
    const pl = ev?.prelabel;
    if (pl) h += `<details class="ai"><summary>查看 AI 预标注（建议先自己判断再看）</summary>${esc((pl.classes || []).map(x => CLASSES[EN.indexOf(x)] ?? x).join('；'))}<br>${esc(pl.note || '')}</details>`;
  }
  h += `<textarea name="comment" placeholder="备注（可选）">${esc(prev?.comment || '')}</textarea>
    <div class="row"><button class="btn" onclick="go(pos+1)">下一条 →</button><span class="saved" id="saved">${prev ? '已保存 ' + esc(prev.saved_at || '') : ''}</span></div>`;
  return h;
}

async function save() {
  if (!reviewer()) { $('#saved').textContent = '请先在右上角填写核验人'; $('#saved').style.color = 'var(--bad)'; return; }
  const it = items()[pos];
  const verdict = document.querySelector('input[name=verdict]:checked')?.value || null;
  const answer = {verdict};
  if (task === 'class') answer.classes = [...document.querySelectorAll('input[name=cls]:checked')].map(x => +x.value);
  const rec = {reviewer: reviewer(), task, item: it.id, answer, comment: document.querySelector('textarea[name=comment]').value};
  let where = '已保存到服务器';
  try {
    const r = await fetch('api/annotations', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(rec)});
    if (!r.ok) throw 0;
  } catch (e) { where = '服务器不可用，已存在本机浏览器'; }
  rec.saved_at = new Date().toLocaleTimeString();
  answers[key(task, it.id)] = rec; store();
  $('#saved').textContent = where; $('#saved').style.color = 'var(--ok)';
  renderList();
}
init();
</script>
</body>
</html>
